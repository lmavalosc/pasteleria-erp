openapi: 3.1.0
info:
  title: Núcleo Contable y DTE API
  version: 1.0.0-fase1
  description: |
    Contrato de API para Fase 1.

    Alcance:
    - Contabilidad básica
    - Facturación / DTE
    - Gastos
    - Documentos

    Reglas principales:
    - Multi-tenant mediante header X-Tenant-ID.
    - Los montos se representan como strings decimales.
    - Los errores usan Problem Details.
    - Los listados usan paginación estándar.
    - Este contrato es la fuente de verdad para tipos TypeScript.

servers:
  - url: http://localhost:8000/api/v1
    description: Desarrollo local

tags:
  - name: system
    description: Endpoints de sistema
  - name: accounting
    description: Contabilidad
  - name: invoicing
    description: Facturación y DTE
  - name: expenses
    description: Gastos
  - name: documents
    description: Documentos adjuntos

paths:
  /health:
    get:
      operationId: getHealth
      tags:
        - system
      summary: Health check
      responses:
        "200":
          description: Servicio saludable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /accounting/accounts:
    get:
      operationId: listAccountingAccounts
      tags:
        - accounting
      summary: Listar cuentas contables
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Lista paginada de cuentas contables
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountingAccountPage"
        default:
          $ref: "#/components/responses/UnexpectedError"
    post:
      operationId: createAccountingAccount
      tags:
        - accounting
      summary: Crear cuenta contable
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountingAccountCreate"
      responses:
        "201":
          description: Cuenta contable creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountingAccount"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /accounting/accounts/{accountId}:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    get:
      operationId: getAccountingAccount
      tags:
        - accounting
      summary: Obtener cuenta contable
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
      responses:
        "200":
          description: Cuenta contable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountingAccount"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"
    patch:
      operationId: updateAccountingAccount
      tags:
        - accounting
      summary: Actualizar cuenta contable
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountingAccountUpdate"
      responses:
        "200":
          description: Cuenta contable actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountingAccount"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /accounting/journal-entries:
    get:
      operationId: listJournalEntries
      tags:
        - accounting
      summary: Listar asientos contables
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Lista paginada de asientos contables
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntryPage"
        default:
          $ref: "#/components/responses/UnexpectedError"
    post:
      operationId: createJournalEntry
      tags:
        - accounting
      summary: Crear asiento contable
      description: |
        Crea un asiento en estado draft.

        El backend debe validar que la suma de débitos sea igual a la suma de créditos.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalEntryCreate"
      responses:
        "201":
          description: Asiento contable creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /accounting/journal-entries/{entryId}:
    parameters:
      - $ref: "#/components/parameters/EntryId"
    get:
      operationId: getJournalEntry
      tags:
        - accounting
      summary: Obtener asiento contable
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
      responses:
        "200":
          description: Asiento contable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /accounting/journal-entries/{entryId}/post:
    parameters:
      - $ref: "#/components/parameters/EntryId"
    post:
      operationId: postJournalEntry
      tags:
        - accounting
      summary: Postear asiento contable
      description: |
        Cambia un asiento de draft a posted.

        Solo debe permitirse si el asiento está balanceado.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
      responses:
        "200":
          description: Asiento posteado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /invoicing/dte:
    get:
      operationId: listDteInvoices
      tags:
        - invoicing
      summary: Listar DTE
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Lista paginada de DTE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DteInvoicePage"
        default:
          $ref: "#/components/responses/UnexpectedError"
    post:
      operationId: createDteInvoice
      tags:
        - invoicing
      summary: Registrar DTE
      description: |
        Registra un DTE interno en estado draft.

        La emisión real ante SII se gestiona mediante el endpoint de issue.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DteInvoiceCreate"
      responses:
        "201":
          description: DTE registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DteInvoice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /invoicing/dte/{dteId}:
    parameters:
      - $ref: "#/components/parameters/DteId"
    get:
      operationId: getDteInvoice
      tags:
        - invoicing
      summary: Obtener DTE
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
      responses:
        "200":
          description: DTE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DteInvoice"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /invoicing/dte/{dteId}/issue:
    parameters:
      - $ref: "#/components/parameters/DteId"
    post:
      operationId: issueDteInvoice
      tags:
        - invoicing
      summary: Emitir DTE
      description: |
        Marca el DTE como emitido.

        En fases posteriores, este endpoint integrará SII.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
      responses:
        "200":
          description: DTE emitido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DteInvoice"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /expenses:
    get:
      operationId: listExpenses
      tags:
        - expenses
      summary: Listar gastos
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Lista paginada de gastos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpensePage"
        default:
          $ref: "#/components/responses/UnexpectedError"
    post:
      operationId: createExpense
      tags:
        - expenses
      summary: Crear gasto
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseCreate"
      responses:
        "201":
          description: Gasto creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /expenses/{expenseId}:
    parameters:
      - $ref: "#/components/parameters/ExpenseId"
    get:
      operationId: getExpense
      tags:
        - expenses
      summary: Obtener gasto
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
      responses:
        "200":
          description: Gasto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"
    patch:
      operationId: updateExpense
      tags:
        - expenses
      summary: Actualizar gasto
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseUpdate"
      responses:
        "200":
          description: Gasto actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /documents:
    get:
      operationId: listDocuments
      tags:
        - documents
      summary: Listar documentos
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Lista paginada de documentos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentPage"
        default:
          $ref: "#/components/responses/UnexpectedError"
    post:
      operationId: createDocument
      tags:
        - documents
      summary: Subir documento
      description: |
        Sube un documento binario y registra sus metadatos.

        Usar multipart/form-data.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/DocumentUploadRequest"
            encoding:
              file:
                contentType: application/octet-stream
      responses:
        "201":
          description: Documento creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /documents/{documentId}:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      operationId: getDocument
      tags:
        - documents
      summary: Obtener metadatos de documento
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
      responses:
        "200":
          description: Documento
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /documents/{documentId}/content:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      operationId: getDocumentContent
      tags:
        - documents
      summary: Descargar contenido de documento
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
      responses:
        "200":
          description: Contenido binario del documento
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"

components:
  parameters:
    TenantIdHeader:
      name: X-Tenant-ID
      in: header
      required: true
      description: |
        Identificador del tenant actual.

        En desarrollo se envía manualmente.
        En producción debe validarse contra autenticación y membresías.
        El cliente nunca debe enviar tenant_id en el body de creación.
      schema:
        $ref: "#/components/schemas/Uuid"

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Clave opcional para evitar duplicidad en operaciones POST.
        Recomendada para creación de gastos, DTE y asientos contables.
      schema:
        type: string

    Page:
      name: page
      in: query
      required: false
      description: Página solicitada, basada en 1.
      schema:
        type: integer
        minimum: 1
        default: 1

    PageSize:
      name: page_size
      in: query
      required: false
      description: Tamaño de página.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    AccountId:
      name: accountId
      in: path
      required: true
      description: Identificador de cuenta contable.
      schema:
        $ref: "#/components/schemas/Uuid"

    EntryId:
      name: entryId
      in: path
      required: true
      description: Identificador de asiento contable.
      schema:
        $ref: "#/components/schemas/Uuid"

    DteId:
      name: dteId
      in: path
      required: true
      description: Identificador de DTE.
      schema:
        $ref: "#/components/schemas/Uuid"

    ExpenseId:
      name: expenseId
      in: path
      required: true
      description: Identificador de gasto.
      schema:
        $ref: "#/components/schemas/Uuid"

    DocumentId:
      name: documentId
      in: path
      required: true
      description: Identificador de documento.
      schema:
        $ref: "#/components/schemas/Uuid"

  schemas:
    Uuid:
      type: string
      format: uuid

    Date:
      type: string
      format: date

    DateTime:
      type: string
      format: date-time

    DecimalString:
      type: string
      description: Número decimal enviado como string para evitar errores de punto flotante. Hasta 2 decimales.
      pattern: '^-?\d+(\.\d{1,2})?$'

    NonNegativeDecimalString:
      type: string
      description: Número decimal no negativo enviado como string. Hasta 2 decimales.
      pattern: '^\d+(\.\d{1,2})?$'

    ChileanRut:
      type: string
      description: Rol Único Tributario (RUT) chileno con o sin puntos y con guion y dígito verificador (0-9 o K).
      pattern: '^(\d{1,2}\.?\d{3}\.?\d{3}-[\dkK]|\d{7,8}-[\dkK])$'
      example: "76.123.456-7"

    HealthResponse:
      type: object
      required:
        - status
        - service
        - version
      properties:
        status:
          type: string
          enum:
            - ok
        service:
          type: string
        version:
          type: string

    PageMeta:
      type: object
      required:
        - page
        - page_size
        - total
        - total_pages
      properties:
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0

    ErrorDetail:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
        message:
          type: string
        code:
          type: string

    ProblemDetail:
      type: object
      required:
        - title
        - status
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"

    AccountType:
      type: string
      enum:
        - asset
        - liability
        - equity
        - income
        - expense

    JournalStatus:
      type: string
      enum:
        - draft
        - posted
        - voided

    DteType:
      type: string
      description: Tipo de DTE según SII de Chile.
      enum:
        - "33"
        - "34"
        - "39"
        - "41"
        - "43"
        - "45"
        - "46"
        - "52"
        - "56"
        - "61"
        - "110"
        - "111"
        - "112"

    DteStatus:
      type: string
      enum:
        - draft
        - issued
        - accepted
        - rejected
        - annulled

    Currency:
      type: string
      enum:
        - CLP
        - USD

    ExpenseStatus:
      type: string
      enum:
        - draft
        - submitted
        - approved
        - paid
        - rejected

    AccountingAccount:
      type: object
      required:
        - id
        - tenant_id
        - code
        - name
        - account_type
        - is_active
        - created_at
        - updated_at
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        tenant_id:
          $ref: "#/components/schemas/Uuid"
        code:
          type: string
          description: Código contable, por ejemplo 1110101.
          pattern: '^[0-9]{1,20}$'
        name:
          type: string
          minLength: 1
          maxLength: 200
        account_type:
          $ref: "#/components/schemas/AccountType"
        is_active:
          type: boolean
        created_at:
          $ref: "#/components/schemas/DateTime"
        updated_at:
          $ref: "#/components/schemas/DateTime"

    AccountingAccountCreate:
      type: object
      required:
        - code
        - name
        - account_type
      properties:
        code:
          type: string
          pattern: '^[0-9]{1,20}$'
        name:
          type: string
          minLength: 1
          maxLength: 200
        account_type:
          $ref: "#/components/schemas/AccountType"

    AccountingAccountUpdate:
      type: object
      minProperties: 1
      properties:
        code:
          type: string
          pattern: '^[0-9]{1,20}$'
        name:
          type: string
          minLength: 1
          maxLength: 200
        account_type:
          $ref: "#/components/schemas/AccountType"
        is_active:
          type: boolean

    AccountingAccountPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/AccountingAccount"

    JournalLine:
      type: object
      description: |
        Línea de asiento contable de partida doble.
        Regla de negocio: Principio XOR: o bien debit > 0 o credit > 0, nunca ambos simultáneamente mayores a 0.
      required:
        - account_id
        - debit
        - credit
      properties:
        account_id:
          $ref: "#/components/schemas/Uuid"
        debit:
          $ref: "#/components/schemas/NonNegativeDecimalString"
          description: Monto al Debe. Si credit > 0, este valor debe ser "0.00".
        credit:
          $ref: "#/components/schemas/NonNegativeDecimalString"
          description: Monto al Haber. Si debit > 0, este valor debe ser "0.00".
        memo:
          type: string

    JournalLineCreate:
      type: object
      description: |
        Datos para crear una línea de asiento contable.
        Regla de negocio: Principio XOR: o bien debit > 0 o credit > 0, nunca ambos simultáneamente mayores a 0.
      required:
        - account_id
        - debit
        - credit
      properties:
        account_id:
          $ref: "#/components/schemas/Uuid"
        debit:
          $ref: "#/components/schemas/NonNegativeDecimalString"
          description: Monto al Debe. Si credit > 0, este valor debe ser "0.00".
        credit:
          $ref: "#/components/schemas/NonNegativeDecimalString"
          description: Monto al Haber. Si debit > 0, este valor debe ser "0.00".
        memo:
          type: string

    JournalEntry:
      type: object
      required:
        - id
        - tenant_id
        - entry_date
        - description
        - status
        - lines
        - total_debit
        - total_credit
        - created_at
        - updated_at
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        tenant_id:
          $ref: "#/components/schemas/Uuid"
        entry_date:
          $ref: "#/components/schemas/Date"
        description:
          type: string
          minLength: 1
        status:
          $ref: "#/components/schemas/JournalStatus"
        lines:
          type: array
          minItems: 2
          items:
            $ref: "#/components/schemas/JournalLine"
        total_debit:
          $ref: "#/components/schemas/NonNegativeDecimalString"
        total_credit:
          $ref: "#/components/schemas/NonNegativeDecimalString"
        posted_at:
          $ref: "#/components/schemas/DateTime"
        created_at:
          $ref: "#/components/schemas/DateTime"
        updated_at:
          $ref: "#/components/schemas/DateTime"

    JournalEntryCreate:
      type: object
      required:
        - entry_date
        - description
        - lines
      properties:
        entry_date:
          $ref: "#/components/schemas/Date"
        description:
          type: string
          minLength: 1
        lines:
          type: array
          minItems: 2
          items:
            $ref: "#/components/schemas/JournalLineCreate"

    JournalEntryPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required:
            - items
