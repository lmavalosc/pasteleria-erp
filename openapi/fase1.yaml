        id:
          $ref: "#/components/schemas/Uuid"
        tenant_id:
          $ref: "#/components/schemas/Uuid"
        expense_date:
          $ref: "#/components/schemas/Date"
        amount:
          $ref: "#/components/schemas/NonNegativeDecimalString"
        currency:
          $ref: "#/components/schemas/Currency"
        status:
          $ref: "#/components/schemas/ExpenseStatus"
        document_id:
          $ref: "#/components/schemas/Uuid"
        description:
          type: string
        merchant:
          type: string
        created_at:
          $ref: "#/components/schemas/DateTime"
        updated_at:
          $ref: "#/components/schemas/DateTime"

    ExpenseCreate:
      type: object
      required:
        - expense_date
        - amount
        - currency
      properties:
        expense_date:
          $ref: "#/components/schemas/Date"
        amount:
          $ref: "#/components/schemas/NonNegativeDecimalString"
        currency:
          $ref: "#/components/schemas/Currency"
        document_id:
          $ref: "#/components/schemas/Uuid"
        description:
          type: string
        merchant:
          type: string

    ExpenseUpdate:
      type: object
      minProperties: 1
      properties:
        status:
          $ref: "#/components/schemas/ExpenseStatus"
        document_id:
          $ref: "#/components/schemas/Uuid"
        description:
          type: string
        merchant:
          type: string

    ExpensePage:
      allOf:
