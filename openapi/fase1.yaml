openapi: 3.1.0
info:
  title: API Pastelería Gourmet & Repostería de Autor - Fase 1
  description: 'Contrato formal OpenAPI 3.1. Módulos: Sistema, Finanzas, Tributario
    (DTE), Egresos con insumos, Bóveda de documentos y Flujo de Producción y Costeo
    (escandallos y órdenes de horneado).'
  version: 1.0.0-fase1
  license:
    name: Proprietary
    url: https://pasteleria-delice.com/licenses/commercial
  contact:
    name: Maison du Délice Tech Team
    email: dev@pasteleria-delice.com
servers:
  - url: http://localhost:4000
    description: Servidor de Desarrollo Local
  - url: https://api.pasteleria-delice.com
    description: Entorno Staging / Producción
security:
  - BearerAuth: []
  - TenantHeader: []
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT con claims sub, tenant_id y role
    TenantHeader:
      type: apiKey
      name: X-Tenant-ID
      in: header
      description: Tenant ID para aislamiento de datos
  parameters:
    TenantIdHeader:
      name: X-Tenant-ID
      in: header
      required: true
      description: Identificador obligatorio de la pastelería/tenant
      schema:
        type: string
        example: default-atelier
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description: Clave única de idempotencia para prevenir duplicados en operaciones de creación
      schema:
        type: string
        format: uuid
        example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
  responses:
    BadRequestError:
      description: Solicitud incorrecta o datos inválidos
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    UnauthorizedError:
      description: No autenticado o token vencido
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ForbiddenError:
      description: No autorizado para acceder a este tenant o recurso
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFoundError:
      description: Recurso no encontrado
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    InternalServerError:
      description: Error interno del servidor
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    NonNegativeDecimalString:
      type: string
      pattern: '^\d+(\.\d{1,2})?$'
      description: Monto monetario no negativo representado como string decimal exacto (hasta 2 decimales) para prevenir errores de precisión flotante.
      example: '15990.00'
    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          description: URI de referencia que identifica el tipo de problema (RFC 7807)
          example: 'about:blank'
        title:
          type: string
          description: Resumen corto y legible del error
          example: 'Bad Request'
        status:
          type: integer
          description: Código de estado HTTP
          example: 400
        detail:
          type: string
          description: Explicación detallada del problema específico ocurrido
          example: 'El asiento contable no está cuadrado: Debe (15000.00) != Haber (14000.00)'
        instance:
          type: string
          description: URI que identifica la ocurrencia específica del problema
          example: '/api/v1/accounting/journal-entries'
        invalid_params:
          type: array
          description: Detalle de errores por campo cuando aplica validación
          items:
            type: object
            required:
              - name
              - reason
            properties:
              name:
                type: string
                example: 'monto_neto'
              reason:
                type: string
                example: 'Debe coincidir con la expresión ^\\d+(\\.\\d{1,2})?$'
    PaginationMeta:
      type: object
      required:
        - total
        - page
        - page_size
        - total_pages
      properties:
        total:
          type: integer
          description: Total de registros disponibles
          example: 42
        page:
          type: integer
          description: Página actual solicitada
          example: 1
        page_size:
          type: integer
          description: Elementos por página
          example: 20
        total_pages:
          type: integer
          description: Cantidad total de páginas
          example: 3
    HealthResponse:
      type: object
      required:
        - status
        - service
        - timestamp
        - tenant_id
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: pasteleria-api-fase1
        timestamp:
          type: string
          format: date-time
        tenant_id:
          type: string
          example: default-atelier
    Account:
      type: object
      required:
        - id
        - tenant_id
        - codigo
        - nombre
        - tipo
        - activa
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
        codigo:
          type: string
          example: '1.1.01'
        nombre:
          type: string
          example: 'Caja Chica y Efectivo'
        tipo:
          type: string
          enum:
            - activo
            - pasivo
            - patrimonio
            - ingreso
            - gasto
        activa:
          type: boolean
          default: true
    AccountCreateInput:
      type: object
      required:
        - codigo
        - nombre
        - tipo
      properties:
        codigo:
          type: string
          example: '1.1.01'
        nombre:
          type: string
          example: 'Caja Chica y Efectivo'
        tipo:
          type: string
          enum:
            - activo
            - pasivo
            - patrimonio
            - ingreso
            - gasto
    PaginatedAccounts:
      type: object
      required:
        - items
        - meta
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Account'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    JournalItem:
      type: object
      required:
        - id
        - entry_id
        - account_id
        - debe
        - haber
      properties:
        id:
          type: string
          format: uuid
        entry_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        debe:
          $ref: '#/components/schemas/NonNegativeDecimalString'
        haber:
          $ref: '#/components/schemas/NonNegativeDecimalString'
        contacto_rut_o_nombre:
          type:
            - string
            - 'null'
          example: '76.123.456-7'
    JournalItemInput:
      type: object
      required:
        - account_id
        - debe
        - haber
      properties:
        account_id:
          type: string
          format: uuid
        debe:
          $ref: '#/components/schemas/NonNegativeDecimalString'
        haber:
          $ref: '#/components/schemas/NonNegativeDecimalString'
        contacto_rut_o_nombre:
          type:
            - string
            - 'null'
          example: '76.123.456-7'
    JournalEntry:
      type: object
      required:
        - id
        - tenant_id
        - numero_asiento
        - fecha_asiento
        - glosa_descripcion
        - estado
        - referencia_origen
        - items
        - created_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
        numero_asiento:
          type: integer
        fecha_asiento:
          type: string
          format: date
        glosa_descripcion:
          type: string
        estado:
          type: string
          enum:
            - draft
            - posted
            - voided
        referencia_origen:
          type: string
          example: MANUAL
        items:
          type: array
          items:
            $ref: '#/components/schemas/JournalItem'
        created_at:
          type: string
          format: date-time
    JournalEntryCreateInput:
      type: object
      required:
        - fecha_asiento
        - glosa_descripcion
        - items
      properties:
        fecha_asiento:
          type: string
          format: date
        glosa_descripcion:
          type: string
        referencia_origen:
          type: string
          default: MANUAL
        items:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/JournalItemInput'
    PaginatedJournalEntries:
      type: object
      required:
        - items
        - meta
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/JournalEntry'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    DTE:
      type: object
      required:
        - id
        - tenant_id
        - tipo_dte
        - folio
        - fecha_emision
        - emisor_rut
        - receptor_rut
        - receptor_razon_social
        - monto_neto
        - monto_exento
        - monto_iva
        - monto_total
        - estado_sii
        - created_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
        tipo_dte:
          type: integer
          enum:
            - 33
            - 39
            - 61
        folio:
          type: integer
        fecha_emision:
          type: string
          format: date
        emisor_rut:
          type: string
          example: '76.999.888-K'
        receptor_rut:
          type: string
          example: '15.432.123-4'
        receptor_razon_social:
          type: string
          example: 'Cliente Particular SpA'
        monto_neto:
          $ref: '#/components/schemas/NonNegativeDecimalString'
        monto_exento:
          $ref: '#/components/schemas/NonNegativeDecimalString'
        monto_iva:
          $ref: '#/components/schemas/NonNegativeDecimalString'
        monto_total:
          $ref: '#/components/schemas/NonNegativeDecimalString'
        estado_sii:
          type: string
          enum:
            - draft
            - generated
            - sent_to_sii
            - accepted_by_sii
            - rejected_by_sii
        track_id_sii:
          type:
            - string
            - 'null'
          example: 'TRACK-889911'
        xml_payload_uri:
          type:
            - string
            - 'null'
          example: 'vault/dte/33-1024.xml'
        order_id:
          type:
            - string
            - 'null'
          format: uuid
        created_at:
          type: string
          format: date-time
    DTECreateInput:
      type: object
      required:
        - tipo_dte
        - fecha_emision
        - emisor_rut
        - receptor_rut
        - receptor_razon_social
        - monto_neto
        - monto_total
      properties:
        tipo_dte:
          type: integer
          enum:
            - 33
            - 39
            - 61
        folio:
          type:
            - integer
            - 'null'
          example: 1024
        fecha_emision:
          type: string
          format: date
        emisor_rut:
          type: string
          example: '76.999.888-K'
        receptor_rut:
          type: string
          example: '15.432.123-4'
        receptor_razon_social:
          type: string
          example: 'Cliente Particular SpA'
        monto_neto:
          $ref: '#/components/schemas/NonNegativeDecimalString'
        monto_exento:
          $ref: '#/components/schemas/NonNegativeDecimalString'
        monto_iva:
          $ref: '#/components/schemas/NonNegativeDecimalString'
        monto_total:
          $ref: '#/components/schemas/NonNegativeDecimalString'
        order_id:
          type:
            - string
            - 'null'
          format: uuid
    PaginatedDtes:
      type: object
      required:
        - items
        - meta
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DTE'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    ExpenseItemDetail:
      type: object
      required:
        - id
        - nombre_insumo
        - cantidad
        - unidad_medida
        - precio_unitario
        - subtotal
      properties:
        id:
          type: string
          format: uuid
        ingredient_id:
          type:
            - string
            - 'null'
          format: uuid
        nombre_insumo:
          type: string
          example: Harina de Trigo Seleccionada
        cantidad:
          type: number
          example: 25.0
        unidad_medida:
          type: string
          example: kg
        precio_unitario:
          $ref: '#/components/schemas/NonNegativeDecimalString'
        subtotal:
          $ref: '#/components/schemas/NonNegativeDecimalString'
    ExpenseItemDetailInput:
      type: object
      required:
        - nombre_insumo
        - cantidad
        - unidad_medida
        - precio_unitario
      properties:
        ingredient_id:
          type:
            - string
            - 'null'
          format: uuid
        nombre_insumo:
          type: string
          example: Harina de Trigo Seleccionada
        cantidad:
          type: number
          example: 25.0
        unidad_medida:
          type: string
          example: kg
        precio_unitario:
          $ref: '#/components/schemas/NonNegativeDecimalString'
    Expense:
      type: object
      required:
        - id
        - tenant_id
        - proveedor_nombre
        - fecha_gasto
        - monto_neto
        - monto_iva
        - monto_total
        - moneda
        - categoria_gasto
        - metodo_pago
        - estado
        - created_by_user_id
        - created_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
        folio_comprobante:
          type:
            - string
            - 'null'
          example: 'FAC-98442'
        proveedor_nombre:
          type: string
          example: 'Molinos del Sur SpA'
        proveedor_rut:
          type:
            - string
            - 'null'
          example: '76.888.777-6'
        fecha_gasto:
          type: string
          format: date
        monto_neto:
          $ref: '#/components/schemas/NonNegativeDecimalString'
        monto_iva:
          $ref: '#/components/schemas/NonNegativeDecimalString'
        monto_total:
          $ref: '#/components/schemas/NonNegativeDecimalString'
        moneda:
          type: string
          default: CLP
          example: CLP
        categoria_gasto:
          type: string
          enum:
            - materias_primas
            - packaging
            - servicios
            - arriendo
            - otros
        metodo_pago:
          type: string
          enum:
            - transferencia
            - efectivo
            - tarjeta_credito
        estado:
          type: string
          enum:
            - draft
            - pending_approval
            - approved
            - rejected
        document_id:
          type:
            - string
            - 'null'
          format: uuid
        insumos_detalle:
          type: array
          items:
            $ref: '#/components/schemas/ExpenseItemDetail'
        created_by_user_id:
          type: string
          example: 'usr_chef_admin'
        approved_by_user_id:
          type:
            - string
            - 'null'
          example: 'usr_owner'
        motivo_rechazo:
          type:
            - string
            - 'null'
          example: 'Factura sin detalle fiscal adjunto'
        created_at:
          type: string
          format: date-time
    ExpenseCreateInput:
      type: object
      required:
        - proveedor_nombre
        - fecha_gasto
        - monto_neto
        - monto_total
      properties:
        folio_comprobante:
          type:
            - string
            - 'null'
          example: 'FAC-98442'
        proveedor_nombre:
          type: string
          example: 'Molinos del Sur SpA'
        proveedor_rut:
          type:
            - string
            - 'null'
          example: '76.888.777-6'
        fecha_gasto:
          type: string
          format: date
        monto_neto:
          $ref: '#/components/schemas/NonNegativeDecimalString'
        monto_iva:
          $ref: '#/components/schemas/NonNegativeDecimalString'
        monto_total:
          $ref: '#/components/schemas/NonNegativeDecimalString'
        moneda:
          type: string
          default: CLP
        categoria_gasto:
          type: string
          enum:
            - materias_primas
            - packaging
            - servicios
            - arriendo
            - otros
          default: materias_primas
        metodo_pago:
          type: string
          enum:
            - transferencia
            - efectivo
            - tarjeta_credito
          default: transferencia
        document_id:
          type:
            - string
            - 'null'
          format: uuid
        insumos_detalle:
          type: array
          items:
            $ref: '#/components/schemas/ExpenseItemDetailInput'
    ExpenseRejectInput:
      type: object
      required:
        - motivo_rechazo
      properties:
        motivo_rechazo:
          type: string
          example: 'Comprobante no legible'
    PaginatedExpenses:
      type: object
      required:
        - items
        - meta
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Expense'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    DocumentMetadata:
      type: object
      required:
        - id
        - tenant_id
        - filename_original
        - mime_type
        - file_size_bytes
        - storage_uri
        - checksum_sha256
        - uploaded_by_user_id
        - created_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
        filename_original:
          type: string
          example: 'factura_compra_molino.pdf'
        mime_type:
          type: string
          example: 'application/pdf'
        file_size_bytes:
          type: integer
          example: 1048576
        storage_uri:
          type: string
          example: 'vault/default-atelier/2026/09/factura.pdf'
        checksum_sha256:
          type: string
          example: 'e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855'
        uploaded_by_user_id:
          type: string
          example: 'usr_chef_admin'
        created_at:
          type: string
          format: date-time
    Ingredient:
      type: object
      required:
        - id
        - tenant_id
        - nombre
        - unidad_medida
        - costo_unitario_promedio
        - stock_actual
        - created_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
        codigo:
          type:
            - string
            - 'null'
          example: 'ING-MAN-01'
        nombre:
          type: string
          example: Mantequilla Francesa sin sal 82% MG
        unidad_medida:
          type: string
          enum:
            - kg
            - g
            - l
            - ml
            - unidad
        costo_unitario_promedio:
          $ref: '#/components/schemas/NonNegativeDecimalString'
        stock_actual:
          type: number
          example: 25.5
        alergenos:
          type: array
          items:
            type: string
          example: ['Lácteos']
        created_at:
          type: string
          format: date-time
    IngredientCreateInput:
      type: object
      required:
        - nombre
        - unidad_medida
        - costo_unitario_promedio
      properties:
        codigo:
          type:
            - string
            - 'null'
          example: 'ING-MAN-01'
        nombre:
          type: string
          example: Mantequilla Francesa sin sal 82% MG
        unidad_medida:
          type: string
          enum:
            - kg
            - g
            - l
            - ml
            - unidad
        costo_unitario_promedio:
          $ref: '#/components/schemas/NonNegativeDecimalString'
        stock_actual:
          type: number
          default: 0.0
        alergenos:
          type: array
          items:
            type: string
    PaginatedIngredients:
      type: object
      required:
        - items
        - meta
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Ingredient'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    RecipeIngredientItem:
      type: object
      required:
        - ingredient_id
        - nombre_ingrediente
        - cantidad_neta
        - unidad_medida
        - porcentaje_merma
        - costo_calculado
      properties:
        ingredient_id:
          type: string
          format: uuid
        nombre_ingrediente:
          type: string
          example: 'Mantequilla Francesa 82% MG'
        cantidad_neta:
          type: number
          example: 0.25
        unidad_medida:
          type: string
          example: 'kg'
        porcentaje_merma:
          type: number
          example: 5.0
        costo_calculado:
          $ref: '#/components/schemas/NonNegativeDecimalString'
    RecipeIngredientItemInput:
      type: object
      required:
        - ingredient_id
        - cantidad_neta
      properties:
        ingredient_id:
          type: string
          format: uuid
        cantidad_neta:
          type: number
          example: 0.25
        porcentaje_merma:
          type: number
          default: 0.0
          example: 5.0
    RecipePackagingItem:
      type: object
      required:
        - nombre
        - costo_unitario
        - cantidad
      properties:
        nombre:
          type: string
          example: 'Caja Premium con cinta de raso'
        costo_unitario:
          $ref: '#/components/schemas/NonNegativeDecimalString'
        cantidad:
          type: number
          default: 1.0
          example: 1.0
    Recipe:
      type: object
      required:
        - id
        - tenant_id
        - product_id
        - nombre_receta
        - rendimiento_porciones
        - ingredientes
        - empaques
        - costo_total_batch
        - costo_por_porcion
        - created_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
        product_id:
          type: string
          example: 'prod_opera_01'
        nombre_receta:
          type: string
          example: 'Ópera Clásica de París 12 Porciones'
        rendimiento_porciones:
          type: number
          example: 12.0
        tiempo_elaboracion_minutos:
          type: integer
          example: 90
        ingredientes:
          type: array
          items:
            $ref: '#/components/schemas/RecipeIngredientItem'
        empaques:
          type: array
          items:
            $ref: '#/components/schemas/RecipePackagingItem'
        costo_total_batch:
          $ref: '#/components/schemas/NonNegativeDecimalString'
        costo_por_porcion:
          $ref: '#/components/schemas/NonNegativeDecimalString'
        instrucciones:
          type:
            - string
            - 'null'
          example: 'Hornear a 180°C durante 12 minutos.'
        created_at:
          type: string
          format: date-time
    RecipeCreateInput:
      type: object
      required:
        - product_id
        - nombre_receta
        - rendimiento_porciones
        - ingredientes
      properties:
        product_id:
          type: string
          example: 'prod_opera_01'
        nombre_receta:
          type: string
          example: 'Ópera Clásica de París 12 Porciones'
        rendimiento_porciones:
          type: number
          minimum: 1
          example: 12.0
        tiempo_elaboracion_minutos:
          type: integer
          default: 60
        ingredientes:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RecipeIngredientItemInput'
        empaques:
          type: array
          items:
            $ref: '#/components/schemas/RecipePackagingItem'
        instrucciones:
          type:
            - string
            - 'null'
          example: 'Hornear a 180°C durante 12 minutos.'
    PaginatedRecipes:
      type: object
      required:
        - items
        - meta
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Recipe'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    ProductCostingAnalysis:
      type: object
      required:
        - product_id
        - tenant_id
        - nombre_producto
        - precio_venta_neto
        - costo_insumos_porcion
        - costo_empaque_porcion
        - costo_total_porcion
        - margen_bruto_monto
        - margen_bruto_porcentaje
        - fecha_calculo
      properties:
        product_id:
          type: string
          example: 'prod_opera_01'
        tenant_id:
          type: string
        nombre_producto:
          type: string
          example: 'Torta Ópera 12 Porciones'
        precio_venta_neto:
          $ref: '#/components/schemas/NonNegativeDecimalString'
        costo_insumos_porcion:
          $ref: '#/components/schemas/NonNegativeDecimalString'
        costo_empaque_porcion:
          $ref: '#/components/schemas/NonNegativeDecimalString'
        costo_total_porcion:
          $ref: '#/components/schemas/NonNegativeDecimalString'
        margen_bruto_monto:
          $ref: '#/components/schemas/NonNegativeDecimalString'
        margen_bruto_porcentaje:
          type: number
          example: 62.5
        alerta_margen_bajo:
          type: boolean
          example: false
        fecha_calculo:
          type: string
          format: date-time
    ProductionOrder:
      type: object
      required:
        - id
        - tenant_id
        - numero_orden
        - recipe_id
        - product_id
        - cantidad_a_elaborar
        - estado
        - fecha_programada
        - inventario_descontado
        - created_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
        numero_orden:
          type: string
          example: 'ORD-2026-001'
        recipe_id:
          type: string
          format: uuid
        product_id:
          type: string
          example: 'prod_opera_01'
        cantidad_a_elaborar:
          type: integer
          example: 4
        estado:
          type: string
          enum:
            - scheduled
            - in_prep
            - baking
            - finished
            - cancelled
        fecha_programada:
          type: string
          format: date
        fecha_finalizada:
          type:
            - string
            - 'null'
          format: date-time
        responsable_chef:
          type:
            - string
            - 'null'
          example: 'Chef Pierre'
        inventario_descontado:
          type: boolean
          example: true
        notas:
          type:
            - string
            - 'null'
          example: 'Decoración con pan de oro comestible'
        created_at:
          type: string
          format: date-time
    ProductionOrderCreateInput:
      type: object
      required:
        - recipe_id
        - cantidad_a_elaborar
        - fecha_programada
      properties:
        recipe_id:
          type: string
          format: uuid
        cantidad_a_elaborar:
          type: integer
          minimum: 1
          example: 4
        fecha_programada:
          type: string
          format: date
        responsable_chef:
          type:
            - string
            - 'null'
          example: 'Chef Pierre'
        descontar_inventario_inmediato:
          type: boolean
          default: true
        notas:
          type:
            - string
            - 'null'
          example: 'Decoración con pan de oro'
    PaginatedProductionOrders:
      type: object
      required:
        - items
        - meta
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductionOrder'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
