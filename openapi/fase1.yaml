  responses:
    BadRequest:
      description: Solicitud inválida.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

    Unauthorized:
      description: No autenticado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

    Forbidden:
      description: Sin permiso para el tenant o recurso.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

    NotFound:
      description: Recurso no encontrado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

    Conflict:
      description: Conflicto de estado o duplicidad.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

    UnprocessableEntity:
      description: Error de validación semántica.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

    UnexpectedError:
      description: Error inesperado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
