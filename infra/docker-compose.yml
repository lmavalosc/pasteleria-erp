services:
  db:
    image: postgres:16-alpine
    container_name: nucleo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nucleo
      POSTGRES_USER: nucleo
      POSTGRES_PASSWORD: nucleo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nucleo -d nucleo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
