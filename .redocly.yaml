# Configuración de Redocly CLI y openapi-typescript para el Monorepo Pastelería

apis:
  fase1@v1:
    root: ./openapi/fase1.yaml
    x-openapi-ts:
      output: ./packages/shared-types/src/openapi.ts

rules:
  struct: error
  info-contact: off
  info-license: off
  operation-4xx-response: warn
  operation-description: off
  no-unused-components: warn
  security-defined: error
  no-ambiguous-paths: error
  no-identical-paths: error
