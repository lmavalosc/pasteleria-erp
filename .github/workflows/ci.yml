name: CI

on:
  push:
    branches: ["main", "develop", "fix/**"]
  pull_request:
    branches: ["main", "develop"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-audit:
    name: 🛡️ Secret Scanning & Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Audit Repository Secrets
        run: python scripts/check-secrets.py

  contract:
    name: 📜 OpenAPI Contract & Anti-Regression Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Generate types
        run: pnpm generate:types

      - name: Check generated types
        run: git diff --exit-code packages/shared-types/src/openapi.ts

      - name: Verify Contract Alignment
        run: python scripts/check_contract_alignment.py

      - name: Anti-Regression Gate
        run: python scripts/check_no_legacy_types.py

  api:
    name: 🐍 FastAPI Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Import app
        env:
          PYTHONPATH: .
        run: python -c "from app.main import app; print('API import ok')"

      - name: Run Pytest Suite
        env:
          PYTHONPATH: .
        run: pytest -v

  web:
    name: ⚡ Web & Packages Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web & Packages
        run: pnpm build

      - name: Typecheck
        run: pnpm type-check

  mobile:
    name: 📱 Mobile App Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Mobile
        run: pnpm --filter @pasteleria/mobile type-check
