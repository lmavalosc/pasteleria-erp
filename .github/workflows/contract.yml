name: Contract

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint OpenAPI
        run: npm run openapi:lint

      - name: Generate types
        run: npm run generate:types

      - name: Check generated types are committed
        run: git diff --exit-code packages/shared-types/src/openapi.ts
