name: Contract

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint OpenAPI
        run: pnpm openapi:lint

      - name: Generate types
        run: pnpm generate:types

      - name: Check generated types are committed
        run: git diff --exit-code packages/shared-types/src/openapi.ts
